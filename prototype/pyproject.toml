[project]
name = "workflow-control-layer"
version = "0.0.1"
description = "Прототип: Workflow Control Layer между Stanislavsky и ClickUp"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "httpx",
    "pyyaml",
    "python-dotenv",
    "openai",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
pythonpath = ["."]
